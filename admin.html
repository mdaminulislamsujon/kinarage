<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KinarAge Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .admin-page {
            min-height: 100vh;
            padding: 30px 20px 60px;
            background: var(--bg, #f5f7fb);
        }

        .admin-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 24px;
            border-radius: 18px;
            background: var(--card-bg, #fff);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        .admin-header h1 {
            margin: 0 0 5px;
        }

        .admin-header p {
            margin: 0;
            opacity: .7;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-btn {
            border-radius: 10px;
            padding: 11px 17px;
            font-size: 14px;
        }

        .home-btn {
            background: #2563eb;
            color: white;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
        }

        .admin-card {
            background: var(--card-bg, #fff);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .07);
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .admin-user {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin-top: 12px;
            border-radius: 999px;
            background: rgba(37, 99, 235, .1);
            color: #2563eb;
            font-size: 14px;
        }

        .product-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            background: transparent;
            color: inherit;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .image-input {
            padding: 10px !important;
        }

        .image-help {
            color: #666;
            font-size: 13px;
        }

        .image-preview-wrapper {
            margin-top: 10px;
        }

        .image-preview {
            width: 180px;
            height: 180px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #ddd;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            color: #888;
            text-align: center;
            padding: 15px;
            font-size: 13px;
        }

        .submit-row {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn {
            border-radius: 10px;
            padding: 13px 22px;
            color: white;
            font-size: 15px;
        }

        .primary-btn {
            background: #2563eb;
        }

        .secondary-btn {
            background: #6b7280;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .products-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th,
        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            white-space: nowrap;
        }

        .product-thumb,
        .no-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
        }

        .product-thumb {
            object-fit: cover;
        }

        .no-thumb {
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center !important;
            padding: 30px !important;
            color: #777;
        }

        .loading {
            padding: 20px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .product-form {
                grid-template-columns: 1fr;
            }

            .form-group.full,
            .submit-row {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<div class="admin-page">

    <div class="admin-container">


        <!-- HEADER -->

        <div class="admin-header">

            <div>

                <h1>
                    👑 KinarAge Admin Panel
                </h1>

                <p>
                    Manage your products
                </p>

                <div
                    id="adminUser"
                    class="admin-user"
                >
                    Checking admin...
                </div>

            </div>


            <div class="admin-actions">

                <button
                    id="homeButton"
                    class="admin-btn home-btn"
                    type="button"
                >
                    🏠 Home
                </button>

                <button
                    id="logoutButton"
                    class="admin-btn logout-btn"
                    type="button"
                >
                    🚪 Logout
                </button>

            </div>

        </div>



        <!-- ADD / EDIT PRODUCT -->

        <div class="admin-card">

            <h2 id="formTitle">
                ➕ Add New Product
            </h2>


            <form
                id="productForm"
                class="product-form"
                enctype="multipart/form-data"
            >


                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        required
                        placeholder="Enter product name"
                    >

                </div>


                <div class="form-group">

                    <label for="productCategory">
                        Category
                    </label>

                    <input
                        type="text"
                        id="productCategory"
                        required
                        placeholder="Laptop / Phone / etc."
                    >

                </div>


                <div class="form-group">

                    <label for="productPrice">
                        Price
                    </label>

                    <input
                        type="text"
                        id="productPrice"
                        required
                        placeholder="৳50,000"
                    >

                </div>


                <div class="form-group">

                    <label for="productRating">
                        Rating
                    </label>

                    <input
                        type="text"
                        id="productRating"
                        placeholder="4.5"
                    >

                </div>


                <div class="form-group">

                    <label for="productValue">
                        Value
                    </label>

                    <input
                        type="text"
                        id="productValue"
                        placeholder="Excellent"
                    >

                </div>


                <div class="form-group">

                    <label for="productProcessor">
                        Processor
                    </label>

                    <input
                        type="text"
                        id="productProcessor"
                        placeholder="Intel Core i5"
                    >

                </div>


                <div class="form-group">

                    <label for="productBattery">
                        Battery
                    </label>

                    <input
                        type="text"
                        id="productBattery"
                        placeholder="5000mAh"
                    >

                </div>


                <div class="form-group">

                    <label for="productCamera">
                        Camera
                    </label>

                    <input
                        type="text"
                        id="productCamera"
                        placeholder="50MP"
                    >

                </div>


                <!-- IMAGE -->

                <div class="form-group full">

                    <label for="productImage">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        class="image-input"
                        accept="image/jpeg,image/png,image/webp,image/gif"
                    >

                    <div class="image-help">
                        JPG, PNG, WEBP or GIF. Maximum 5MB.
                    </div>


                    <div class="image-preview-wrapper">

                        <div
                            id="imagePreview"
                            class="image-preview"
                        >

                            <div class="no-image">
                                📷<br>
                                No image selected
                            </div>

                        </div>

                    </div>


                    <div
                        id="uploadInfo"
                        class="image-help"
                    ></div>

                </div>



                <!-- BUTTONS -->

                <div class="submit-row">

                    <button
                        type="submit"
                        id="submitButton"
                        class="primary-btn"
                    >
                        ➕ Add Product
                    </button>


                    <button
                        type="button"
                        id="cancelEditButton"
                        class="secondary-btn"
                        style="display:none;"
                    >
                        Cancel Edit
                    </button>

                </div>


            </form>


            <div
                id="formMessage"
                class="message"
            ></div>

        </div>



        <!-- PRODUCTS -->

        <div class="admin-card">

            <h2>
                📦 Products
            </h2>


            <div
                id="productsLoading"
                class="loading"
            >
                Loading products...
            </div>


            <div
                id="productsTableWrapper"
                class="products-table-wrapper"
                style="display:none;"
            >

                <table class="products-table">

                    <thead>

                        <tr>

                            <th>Image</th>

                            <th>Name</th>

                            <th>Category</th>

                            <th>Price</th>

                            <th>Rating</th>

                            <th>Processor</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody
                        id="productsTableBody"
                    ></tbody>

                </table>

            </div>

        </div>


    </div>

</div>



<script>


// ==========================================
// API CONFIG
// ==========================================

const API_URL =
    "https://kinarage-backend.onrender.com/api";

const SERVER_URL =
    "http://localhost:5000";


// ==========================================
// STATE
// ==========================================

let productsData = [];

let editingProductId = null;

let currentPreviewURL = null;


// ==========================================
// DOM
// ==========================================

const adminUser =
    document.getElementById("adminUser");

const logoutButton =
    document.getElementById("logoutButton");

const homeButton =
    document.getElementById("homeButton");

const productForm =
    document.getElementById("productForm");

const productImage =
    document.getElementById("productImage");

const imagePreview =
    document.getElementById("imagePreview");

const uploadInfo =
    document.getElementById("uploadInfo");

const formMessage =
    document.getElementById("formMessage");

const formTitle =
    document.getElementById("formTitle");

const submitButton =
    document.getElementById("submitButton");

const cancelEditButton =
    document.getElementById("cancelEditButton");

const productsLoading =
    document.getElementById("productsLoading");

const productsTableWrapper =
    document.getElementById("productsTableWrapper");

const productsTableBody =
    document.getElementById("productsTableBody");


// ==========================================
// TOKEN
// ==========================================

function getToken() {

    return localStorage.getItem(
        "kinarage-token"
    );

}


// ==========================================
// SAVED USER
// ==========================================

function getSavedUser() {

    try {

        const value =
            localStorage.getItem(
                "kinarage-user"
            );

        return value
            ? JSON.parse(value)
            : null;

    } catch {

        return null;

    }

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// IMAGE URL
// ==========================================

function getImageURL(imageURL) {

    if (!imageURL) {
        return null;
    }

    if (
        imageURL.startsWith("http://") ||
        imageURL.startsWith("https://")
    ) {

        return imageURL;

    }

    return SERVER_URL + imageURL;

}


// ==========================================
// MESSAGE
// ==========================================

function showMessage(
    message,
    type = "success"
) {

    formMessage.textContent =
        message;

    formMessage.className =
        `message ${type}`;

}


// ==========================================
// CLEAR AUTH
// ==========================================

function clearAuth() {

    localStorage.removeItem(
        "kinarage-token"
    );

    localStorage.removeItem(
        "kinarage-user"
    );

}


// ==========================================
// AUTH CHECK
// ==========================================

async function checkAdmin() {

    const token =
        getToken();

    const savedUser =
        getSavedUser();


    if (
        !token ||
        !savedUser ||
        savedUser.role !== "admin"
    ) {

        window.location.href =
            "admin-login.html";

        return false;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/auth/me`,
                {
                    method: "GET",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Authentication failed"
            );

        }


        const data =
            await response.json();


        if (
            !data.user ||
            data.user.role !== "admin"
        ) {

            throw new Error(
                "Admin access required"
            );

        }


        adminUser.innerHTML =
            `👑 ${escapeHTML(
                data.user.name
            )} · ${escapeHTML(
                data.user.email
            )}`;


        return true;


    } catch (error) {

        console.error(
            "Admin authentication error:",
            error
        );


        clearAuth();


        window.location.href =
            "admin-login.html";


        return false;

    }

}


// ==========================================
// LOGOUT
// ==========================================

logoutButton.addEventListener(
    "click",
    () => {

        clearAuth();

        window.location.href =
            "admin-login.html";

    }
);


// ==========================================
// HOME
// ==========================================

homeButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";

    }
);


// ==========================================
// IMAGE PREVIEW
// ==========================================

productImage.addEventListener(
    "change",
    () => {

        const file =
            productImage.files[0];


        if (!file) {

            imagePreview.innerHTML = `
                <div class="no-image">
                    📷<br>
                    No image selected
                </div>
            `;

            uploadInfo.textContent = "";

            return;

        }


        // SIZE

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            productImage.value = "";

            imagePreview.innerHTML = `
                <div class="no-image">
                    ❌ Image must be less than 5MB
                </div>
            `;

            uploadInfo.textContent =
                "❌ File is larger than 5MB.";

            return;

        }


        // TYPE

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];


        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            productImage.value = "";

            imagePreview.innerHTML = `
                <div class="no-image">
                    ❌ Unsupported image type
                </div>
            `;

            uploadInfo.textContent =
                "❌ Only JPG, PNG, WEBP and GIF are allowed.";

            return;

        }


        // OLD PREVIEW

        if (currentPreviewURL) {

            URL.revokeObjectURL(
                currentPreviewURL
            );

        }


        // NEW PREVIEW

        currentPreviewURL =
            URL.createObjectURL(
                file
            );


        imagePreview.innerHTML = `
            <img
                src="${currentPreviewURL}"
                alt="Product preview"
            >
        `;


        uploadInfo.textContent =
            `📁 ${file.name} · ${
                (
                    file.size /
                    1024 /
                    1024
                ).toFixed(2)
            } MB`;

    }
);


// ==========================================
// LOAD PRODUCTS
// ==========================================

async function loadProducts() {

    productsLoading.style.display =
        "block";

    productsTableWrapper.style.display =
        "none";


    try {

        const response =
            await fetch(
                `${API_URL}/products`
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        productsData =
            Array.isArray(data)
                ? data
                : data.products || [];


        renderProducts();


    } catch (error) {

        console.error(
            "Load products error:",
            error
        );


        productsLoading.innerHTML = `
            ❌ Failed to load products.
            <br><br>
            Make sure PostgreSQL and Node.js server are running.
        `;

    }

}


// ==========================================
// RENDER PRODUCTS
// ==========================================

function renderProducts() {

    productsLoading.style.display =
        "none";

    productsTableWrapper.style.display =
        "block";


    if (
        !productsData ||
        productsData.length === 0
    ) {

        productsTableBody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty-state"
                >
                    No products found.
                </td>
            </tr>
        `;

        return;

    }


    productsTableBody.innerHTML =
        productsData
            .map(
                (product) => {

                    const imageURL =
                        getImageURL(
                            product.image_url
                        );


                    const imageHTML =
                        imageURL
                            ? `
                                <img
                                    class="product-thumb"
                                    src="${escapeHTML(imageURL)}"
                                    alt="${escapeHTML(product.name)}"
                                    onerror="
                                        this.style.display='none';
                                        this.nextElementSibling.style.display='flex';
                                    "
                                >

                                <div
                                    class="no-thumb"
                                    style="display:none;"
                                >
                                    📦
                                </div>
                            `
                            : `
                                <div class="no-thumb">
                                    📦
                                </div>
                            `;


                    return `
                        <tr>

                            <td>
                                ${imageHTML}
                            </td>

                            <td>
                                <strong>
                                    ${escapeHTML(
                                        product.name
                                    )}
                                </strong>
                            </td>

                            <td>
                                ${escapeHTML(
                                    product.category
                                )}
                            </td>

                            <td>
                                <strong>
                                    ${escapeHTML(
                                        product.price
                                    )}
                                </strong>
                            </td>

                            <td>
                                ${escapeHTML(
                                    product.rating || "N/A"
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    product.processor || "N/A"
                                )}
                            </td>

                            <td>

                                <div class="action-buttons">

                                    <button
                                        type="button"
                                        class="edit-btn"
                                        data-id="${product.id}"
                                    >
                                        ✏️ Edit
                                    </button>

                                    <button
                                        type="button"
                                        class="delete-btn"
                                        data-id="${product.id}"
                                    >
                                        🗑️ Delete
                                    </button>

                                </div>

                            </td>

                        </tr>
                    `;

                }
            )
            .join("");


    // EDIT

    document
        .querySelectorAll(".edit-btn")
        .forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        startEdit(
                            Number(
                                button.dataset.id
                            )
                        );

                    }
                );

            }
        );


    // DELETE

    document
        .querySelectorAll(".delete-btn")
        .forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteProduct(
                            Number(
                                button.dataset.id
                            )
                        );

                    }
                );

            }
        );

}


// ==========================================
// START EDIT
// ==========================================

function startEdit(id) {

    const product =
        productsData.find(
            (item) =>
                Number(item.id) ===
                Number(id)
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    editingProductId =
        product.id;


    formTitle.textContent =
        `✏️ Edit Product #${product.id}`;


    submitButton.textContent =
        "💾 Update Product";


    cancelEditButton.style.display =
        "inline-block";


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || "";


    document.getElementById(
        "productRating"
    ).value =
        product.rating || "";


    document.getElementById(
        "productValue"
    ).value =
        product.value || "";


    document.getElementById(
        "productProcessor"
    ).value =
        product.processor || "";


    document.getElementById(
        "productBattery"
    ).value =
        product.battery || "";


    document.getElementById(
        "productCamera"
    ).value =
        product.camera || "";


    // EXISTING IMAGE

    const imageURL =
        getImageURL(
            product.image_url
        );


    if (imageURL) {

        imagePreview.innerHTML = `
            <img
                src="${escapeHTML(imageURL)}"
                alt="Current product image"
            >
        `;


        uploadInfo.textContent =
            `Current image: ${
                product.image_url
            }`;

    } else {

        imagePreview.innerHTML = `
            <div class="no-image">
                📷<br>
                No existing image
            </div>
        `;

        uploadInfo.textContent = "";

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ==========================================
// CANCEL EDIT
// ==========================================

cancelEditButton.addEventListener(
    "click",
    resetForm
);


// ==========================================
// RESET FORM
// ==========================================

function resetForm() {

    editingProductId = null;


    productForm.reset();


    formTitle.textContent =
        "➕ Add New Product";


    submitButton.textContent =
        "➕ Add Product";


    cancelEditButton.style.display =
        "none";


    imagePreview.innerHTML = `
        <div class="no-image">
            📷<br>
            No image selected
        </div>
    `;


    uploadInfo.textContent = "";


    formMessage.className =
        "message";


    formMessage.textContent =
        "";


    if (currentPreviewURL) {

        URL.revokeObjectURL(
            currentPreviewURL
        );

        currentPreviewURL = null;

    }

}


// ==========================================
// ADD / UPDATE PRODUCT
// ==========================================

productForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const token =
            getToken();


        if (!token) {

            window.location.href =
                "admin-login.html";

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "name",
            document
                .getElementById("productName")
                .value
                .trim()
        );


        formData.append(
            "category",
            document
                .getElementById("productCategory")
                .value
                .trim()
        );


        formData.append(
            "price",
            document
                .getElementById("productPrice")
                .value
                .trim()
        );


        formData.append(
            "rating",
            document
                .getElementById("productRating")
                .value
                .trim()
        );


        formData.append(
            "value",
            document
                .getElementById("productValue")
                .value
                .trim()
        );


        formData.append(
            "processor",
            document
                .getElementById("productProcessor")
                .value
                .trim()
        );


        formData.append(
            "battery",
            document
                .getElementById("productBattery")
                .value
                .trim()
        );


        formData.append(
            "camera",
            document
                .getElementById("productCamera")
                .value
                .trim()
        );


        // IMAGE

        const imageFile =
            productImage.files[0];


        if (imageFile) {

            if (
                imageFile.size >
                5 * 1024 * 1024
            ) {

                showMessage(
                    "Image must be less than 5MB.",
                    "error"
                );

                return;

            }


            formData.append(
                "image",
                imageFile
            );

        }


        const isEditing =
            editingProductId !== null;


        const url =
            isEditing
                ? `${API_URL}/products/${editingProductId}`
                : `${API_URL}/products`;


        const method =
            isEditing
                ? "PUT"
                : "POST";


        submitButton.disabled =
            true;


        cancelEditButton.disabled =
            true;


        submitButton.textContent =
            isEditing
                ? "Updating..."
                : "Uploading & Adding...";


        try {

            const response =
                await fetch(
                    url,
                    {
                        method,

                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        },

                        body: formData
                    }
                );


            let data = {};


            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            // 401

            if (
                response.status === 401
            ) {

                clearAuth();

                window.location.href =
                    "admin-login.html";

                return;

            }


            // 403

            if (
                response.status === 403
            ) {

                showMessage(
                    "Admin access required.",
                    "error"
                );

                return;

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    data.message ||
                    "Product operation failed"
                );

            }


            showMessage(
                isEditing
                    ? "Product updated successfully!"
                    : "Product added successfully!",
                "success"
            );


            resetForm();


            await loadProducts();


        } catch (error) {

            console.error(
                "Product save error:",
                error
            );


            showMessage(
                error.message ||
                "Something went wrong.",
                "error"
            );


        } finally {

            submitButton.disabled =
                false;

            cancelEditButton.disabled =
                false;


            submitButton.textContent =
                editingProductId !== null
                    ? "💾 Update Product"
                    : "➕ Add Product";

        }

    }
);


// ==========================================
// DELETE PRODUCT
// ==========================================

async function deleteProduct(id) {

    const product =
        productsData.find(
            (item) =>
                Number(item.id) ===
                Number(id)
        );


    if (!product) {
        return;
    }


    const confirmed =
        confirm(
            `Are you sure you want to delete "${product.name}"?`
        );


    if (!confirmed) {
        return;
    }


    const token =
        getToken();


    if (!token) {

        window.location.href =
            "admin-login.html";

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/products/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        let data = {};


        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (
            response.status === 401
        ) {

            clearAuth();

            window.location.href =
                "admin-login.html";

            return;

        }


        if (
            response.status === 403
        ) {

            showMessage(
                "Admin access required.",
                "error"
            );

            return;

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to delete product"
            );

        }


        if (
            Number(editingProductId) ===
            Number(id)
        ) {

            resetForm();

        }


        showMessage(
            "Product deleted successfully!",
            "success"
        );


        await loadProducts();


    } catch (error) {

        console.error(
            "Delete product error:",
            error
        );


        showMessage(
            error.message ||
            "Failed to delete product.",
            "error"
        );

    }

}


// ==========================================
// INIT
// ==========================================

async function init() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {
        return;
    }


    await loadProducts();

}


// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    init
);

</script>
